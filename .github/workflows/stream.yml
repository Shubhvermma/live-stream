name: 24/7 Live Stream

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb nodejs

      - name: Run Live Broadcast
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ffmpeg -re -stream_loop -1 -i background.jpg -stream_loop -1 -i music.m4a -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -flvflags no_duration_filesize -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
